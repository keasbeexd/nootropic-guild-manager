# Publishes a release when a version tag (v1.2.3) is pushed:
#   1. builds LuaJIT and runs the offline tests (tests/run.sh); a failure
#      stops the release
#   2. packages the addon with the BigWigs packager and uploads it to
#      GitHub (with release.json, which WowUp reads), CurseForge and Wago.
#   3. announces it in Discord (version, changelog, links): every release in
#      the addon's channel (DISCORD_RELEASE_WEBHOOK, no ping); feature
#      releases (x.y.0) also in #announcements (DISCORD_ANNOUNCE_WEBHOOK,
#      pinging the role in the DISCORD_ANNOUNCE_ROLE_ID variable). A Discord
#      hiccup never fails the release, which is already uploaded by then.
# Test releases: a tag with a dash (v2.12.0-beta1) goes to GitHub only, as a
# pre-release, with no Discord post: the packager is told to leave out
# CurseForge and Wago (-p 0 -a 0, "unset the TOC value").
# CurseForge and Wago are skipped until their project IDs are in the TOC
# (X-Curse-Project-ID, X-Wago-ID) and their tokens are repository secrets
# (CURSEFORGE, WAGO). See docs/PUBLISHING.md.
#
# Security: runs only on tags you push (never on pull requests, so outside
# code can't reach the tokens); actions are pinned to exact commits; the job
# may only write releases.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # the packager reads CF_API_KEY / WAGO_API_TOKEN; the repository
      # secrets are named CURSEFORGE and WAGO
      CF_API_KEY: ${{ secrets.CURSEFORGE }}
      WAGO_API_TOKEN: ${{ secrets.WAGO }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      # LuaJIT from its own repository (pinned), not from Ubuntu's package
      # servers, which a release must not depend on (they were unreachable
      # from GitHub's runners on 2026-11-11 and hung the release).
      # actions/checkout v7.0.1; LuaJIT v2.1 branch, 2026-10-21
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: LuaJIT/LuaJIT
          ref: a4c064539ea931274d407e1249b4bb575424a0f4
          path: .luajit
          persist-credentials: false

      - name: Offline tests
        timeout-minutes: 10
        run: |
          make -C .luajit -j4 -s
          export PATH="$PWD/.luajit/src:$PATH"
          tests/run.sh

      # The packager skips a site silently when its token is missing, so
      # say so: a release with an ID in the TOC but no token fails here.
      - name: Check upload tokens
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          missing=0
          if grep -q '^## X-Curse-Project-ID:' NootropicGuildManager.toc && [ -z "$CF_API_KEY" ]; then
            echo "::error::The CURSEFORGE secret is empty, so nothing would go to CurseForge"; missing=1
          fi
          if grep -q '^## X-Wago-ID:' NootropicGuildManager.toc && [ -z "$WAGO_API_TOKEN" ]; then
            echo "::error::The WAGO secret is empty, so nothing would go to Wago"; missing=1
          fi
          exit $missing

      # BigWigsMods/packager v2.6.1
      - uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0
        with:
          args: ${{ contains(github.ref_name, '-') && '-p 0 -a 0' || '' }}

      - name: Announce on Discord
        if: ${{ !contains(github.ref_name, '-') }}
        continue-on-error: true
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          DISCORD_ANNOUNCE_WEBHOOK: ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK }}
          DISCORD_ANNOUNCE_ROLE_ID: ${{ vars.DISCORD_ANNOUNCE_ROLE_ID }}
        run: python3 .github/scripts/discord_release.py
